name: Build image

on:
  push:
    branches: [patched]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --no-shell --with-deps chromium

      - name: Run type checker
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify runtime package pruning
        run: >-
          docker run --rm --entrypoint sh
          "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          -c 'test ! -d /app/node_modules/npm &&
          ! find /app/node_modules -maxdepth 3 -type d
          -name "*-linux-*-musl" -print -quit | grep -q .'

      - name: Run Docker E2E tests
        env:
          DOCKER_IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: npm run test:docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        run: docker push "ghcr.io/${{ github.repository }}:${{ github.sha }}"
